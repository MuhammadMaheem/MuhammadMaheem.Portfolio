<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="refresh" content="0; url=__ADMIN_URL__" />
  <title>Opening admin…</title>
  <style>
    html { background: #0b0d12; color: #eceef3; font: 16px/1.5 system-ui, sans-serif; }
    body { min-height: 100vh; display: grid; place-content: center; text-align: center; margin: 0; }
    a { color: #00d4ff; }
  </style>
</head>
<body>
  <p>Opening the admin panel… <a href="__ADMIN_URL__">Continue</a></p>
  <script>
    // Opening this address once also switches on the owner-only "Admin" button in this browser's copy of the site.
    try { localStorage.setItem('site.owner', '1'); } catch (e) { /* storage blocked: the redirect still works */ }
    location.replace('__ADMIN_URL__');
  </script>
</body>
</html>
